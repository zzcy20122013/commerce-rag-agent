[project]
name = "commerce-rag-agent-backend"
version = "0.1.0"
description = "FastAPI backend for a multimodal RAG shopping guide agent."
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "fastapi>=0.115.0",
    "FlagEmbedding>=1.3.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "pillow>=12.0.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
